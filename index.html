<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOYEKOLA CONGO</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
h1{color:#facc15;font-size:32px}
.card{background:white;color:black;border-radius:15px;padding:20px;margin:15px auto;max-width:400px}
button{background:#16a34a;color:white;border:none;padding:12px 20px;border-radius:10px;font-size:16px;width:100%;margin-top:10px}
#result{font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<h1>🇨🇩 TOYEKOLA CONGO</h1>
<p>Apprendre le Congo en s'amusant</p>

<div class="card">
<h2>Quiz : Lingala</h2>
<p><b>Comment on dit "Bonjour" en Lingala ?</b></p>
<button onclick="check(this,'ok')">Mbote</button>
<button onclick="check(this,'no')">Mboté na yo ? Non</button>
<button onclick="check(this,'no')">Naza bien</button>
<p id="result"></p>
</div>

<div class="card">
<h2>Quiz : Kinshasa</h2>
<p><b>Quelle est la capitale de la RDC ?</b></p>
<button onclick="check2(this,'ok')">Kinshasa</button>
<button onclick="check2(this,'no')">Lubumbashi</button>
<button onclick="check2(this,'no')">Goma</button>
<p id="result2"></p>
</div>

<script>
function check(b,rep){
document.getElementById('result').innerText = rep==='ok' ? '✅ Bravo ! Mbote = Bonjour' : '❌ Essaie encore !';
}
function check2(b,rep){
document.getElementById('result2').innerText = rep==='ok' ? '✅ Bravo ! Kinshasa est la capitale' : '❌ Essaie encore !';
}
</script>
</body>
</html>
